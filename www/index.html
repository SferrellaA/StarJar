<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STOP REVERSE ENGINEERING</title>
<script src="/brython.js"></script>
<script src="/brython_stdlib.js"></script>
<style>
html { min-height: 100%; background-color: #e5f4f8; background-image: linear-gradient(148deg, #fbfdfe 0%, #e5f4f8 46%, #c7e6f1 100%); background-attachment: fixed; }
body { margin: 2rem auto; max-width: 40rem; line-height: 1.45; font-family: Georgia, serif; color: #222; background: transparent; padding: 0 1rem 2rem; }
h1 { font-family: Impact, sans-serif; letter-spacing: 0.03em; }
aside { font-family: sans-serif; font-weight: 700; }
li { margin: 0.4rem 0; }
.scrollmenu { display: flex; gap: 1rem; overflow-x: auto; align-items: flex-start; }
figure { margin: 0; flex: 0 0 auto; text-align: center; }
figcaption { color: #c40000; font-family: sans-serif; font-weight: 700; font-size: 0.9rem; max-width: 28rem; white-space: normal; }
svg, img { background: #fff; border: 1px solid #bbb; }
</style>
</head>
<body onload="brython()">
<script type="text/python">
from browser import document, ajax, window
from browser.html import *

# list endpoint: /get/

document.select_one("head") <= TITLE("STOP REVERSE ENGINEERING")

header = HEADER()
header <= H1("STOP DOING ") <= CODE("Reverse engineering")
header <= ASIDE("APIS WERE NOT MEANT TO BE UNDERSTOOD")
document <= header

arguments = UL()
arguments <= LI("YEARS OF REVERSE ENGINEERING yet NO REAL-WORLD USE FOR understanding compiled CODE")
arguments <= LI("sure we are not relaying information that could be used against us")
arguments <= LI("security through obscurity")
arguments <= LI("have you tried ghidra-mcp? did you install kali?")
arguments <= LI("cease and desist")
arguments <= LI("Title 49 Code of Federal Regulations parts § 1540.103(c) states: No person may make, or cause to be made any reproduction or alteration, for fraudulent purpose, of any report, record, security program, access medium, or identification medium issued under this subchapter. ")
arguments <= LI("Computers were supposed to solve meath, not to be programmed")
arguments <= LI("C is a letter, not a language")
arguments <= LI("wanna print() something? Write in a paper with a pen")
arguments <= LI('"I\'n writing a recursive method with threads to optimize the cpu usage in a 0.02%" this is a nonsensical statement made by deranged people')
arguments <= LI("glowing text", style="text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 15px #00ff00;")
document <= arguments

document <= P("look at what FMA has been demanding your respect for, after we put all the walls around their section")
document <= P() <= STRONG("(this is real computer science done by real computer scientists):")

scrollmenu = DIV(Class="scrollmenu")
document <= scrollmenu

def mount_svg(markup, caption):
    parser = window.DOMParser.new()
    parsed = parser.parseFromString(markup, "image/svg+xml")
    node = parsed.documentElement
    if node is None:
        return
    tag = (node.tagName or "").lower()
    if tag in ("parsererror", "html"):
        return
    figure = FIGURE()
    figure <= node
    figure <= FIGCAPTION(caption)
    scrollmenu <= figure

def mount_script(source):
    ns = {"__name__": "figure"}
    exec(source, ns)
    draw = ns.get("svg")
    if not callable(draw):
        return
    markup = draw()
    if not isinstance(markup, str) or "<svg" not in markup:
        return
    caption = ns.get("CAPTION") or "real computer science"
    mount_svg(markup, str(caption))

def add_figures(req):
    try:
        if req.status != 200:
            return
        body = req.text or ""
    except Exception:
        return
    names = []
    for raw in body.splitlines():
        name = raw.strip()
        if not name or "/" in name or name in (".", "..", ".gitkeep") or name.endswith("/"):
            continue
        lower = name.lower()
        if lower.endswith(".py"):
            names.append(name)
        elif lower.endswith((".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg")):
            figure = FIGURE()
            figure <= IMG(src="/get/images/" + name, alt="")
            figure <= FIGCAPTION("real computer science")
            scrollmenu <= figure

    def load(i=0):
        if i >= len(names):
            return
        name = names[i]

        def done(resp, name=name, i=i):
            try:
                if resp.status == 200 and resp.text:
                    mount_script(resp.text)
            except Exception:
                pass
            load(i + 1)

        ajax.get("/get/images/" + name, mode="text", oncomplete=done)

    load()

# figures are optional. an empty images directory must not throw.
# list endpoint: /get/images
ajax.get("/get/images", mode="text", oncomplete=add_figures)

document <= P() <= STRONG("IF REVERSE ENGINEERING WAS REAL HOW COME NOBODY THOUGHT OF PUBLISHING SOURCE CODE")
document <= P() <= STRONG("THEY'VE PLAYED US FOR ABSOLUTE FOOLS")
</script>
